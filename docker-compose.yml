x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'
    compress: 'true'

services:
  migrator:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    env_file:
      - packages/db/.env
    # Supabase pooler (:6543) rejects DDL; migrate deploy needs the direct URL.
    environment:
      DATABASE_URL: ${DIRECT_URL}
    restart: 'no'
    logging: *default-logging
  seeder:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    env_file:
      - packages/db/.env
    environment:
      DATABASE_URL: ${DIRECT_URL}
    depends_on:
      migrator:
        condition: service_completed_successfully
    command: sh -lc "npx prisma generate --schema=packages/db/dist/schema.prisma && npx tsx packages/db/prisma/seed/seed.ts"
    restart: 'no'
    logging: *default-logging
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        NEXT_PUBLIC_BETTER_AUTH_URL: ${BETTER_AUTH_URL}
    depends_on:
      seeder:
        condition: service_completed_successfully
    ports:
      - '3000:3000'
    env_file:
      - apps/app/.env
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3000/api/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
    command: sh -lc "node apps/app/server.js"
    logging: *default-logging
  portal:
    build:
      context: .
      dockerfile: Dockerfile
      target: portal
      args:
        NEXT_PUBLIC_BETTER_AUTH_URL: ${BETTER_AUTH_URL_PORTAL}
    depends_on:
      app:
        condition: service_started
    ports:
      - '3002:3000'
    env_file:
      - apps/portal/.env
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3000/ || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging
