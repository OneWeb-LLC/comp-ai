name: PR Governance / Deterministic CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  deterministic-ci:
    name: PR Governance / Deterministic CI
    if: >-
      startsWith(github.head_ref, 'cursor/') ||
      startsWith(github.head_ref, 'codex/') ||
      startsWith(github.head_ref, 'ONE-') ||
      contains(github.event.pull_request.labels.*.name, 'automated-pr')
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Detect governance-only diff
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mapfile -t CHANGED < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          if [ "${#CHANGED[@]}" -eq 0 ]; then
            echo "governance_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NON_GITHUB=0
          for file in "${CHANGED[@]}"; do
            case "$file" in
              .github/*) ;;
              *) NON_GITHUB=$((NON_GITHUB + 1)) ;;
            esac
          done
          if [ "$NON_GITHUB" -eq 0 ]; then
            echo "governance_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "governance_only=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Changed files: ${CHANGED[*]}"

      - uses: ./.github/actions/dangerous-git-checkout

      - uses: ./.github/actions/bun-install
        if: steps.scope.outputs.governance_only != 'true'

      - uses: ./.github/actions/governance-setup
        if: steps.scope.outputs.governance_only == 'true'

      - name: Run governance unit tests
        if: steps.scope.outputs.governance_only == 'true'
        run: bun test ./.github/pr-governance/governance.test.ts

      - name: Typecheck application code
        if: steps.scope.outputs.governance_only != 'true'
        run: bun run typecheck:ci
