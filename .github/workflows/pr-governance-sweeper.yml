name: PR Governance / Stale PR Sweeper

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun-install

      - name: Find stale agent PRs
        id: sweep
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STALE_HOURS: '24'
        run: bun .github/pr-governance/stale-sweeper.ts | tee sweep.json

      - name: Re-enqueue lifecycle controller for stale PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRS=$(jq -r '.staleCandidates[]?' sweep.json)
          for PR in $PRS; do
            gh workflow run pr-lifecycle-controller.yml -f pr_number="$PR"
          done
